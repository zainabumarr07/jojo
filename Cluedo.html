<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
</head>
<body>
    <div id="cluedo">
        <h1 v-text = "title"></h1>
        <ul>
            <li v-for="suspect in suspects">
                {{suspect.name}}
            </li>
        </ul>

    <script type="module">
        const {createApp} = Vue
        const myApp = createApp({
            data(){
                return{
                    title:"Cluedo",
                    suspects:[
                        {
                            name: "Col Mustard",
                            color: "yellow"
                        },
                        {
                            name:"Rev Green",
                            color:"green"
                        },
                        {
                            name: "Miss Scarlett",
                            color: "red",
                        },
                        {
                            name: "Mrs White",
                            color: "white",
                        },
                        {
                            name: "Mrs Peacock",
                            color: "blue",
                        },
                        {
                            name: "Professor Plum",
                            color: "purple",
                        },
                    ]
                }
            }
        })
        myApp.mount('#cluedo')
    </script>
</body>
</html>
